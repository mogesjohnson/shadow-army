name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      # One system failing must not hide the others' results.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm test
      - name: Native TypeScript 7 language server
        run: npm run test:lsp
      # The commit-msg hook is a POSIX sh script; check it under a real sh, not only Git for Windows'.
      - name: commit-msg hook under sh
        if: runner.os != 'Windows'
        shell: bash
        run: |
          printf '#1 Add a thing\n' > "$RUNNER_TEMP/good"
          sh .githooks/commit-msg "$RUNNER_TEMP/good"
          printf 'feat: a thing\n' > "$RUNNER_TEMP/bad"
          if sh .githooks/commit-msg "$RUNNER_TEMP/bad"; then echo "the hook accepted a bad subject"; exit 1; fi
          echo "hook OK"
